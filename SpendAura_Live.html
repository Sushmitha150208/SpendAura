<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendAura – Personal Expense Tracker</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM & Babel for zero-build execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aura: {
              plum: '#581C38',
              'plum-hover': '#43132A',
              'plum-light': '#FCE7EE',
              bg: '#FCEDF0',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FCEDF0;
      color: #3A0D22;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #E8D3D8;
      border-radius: 9999px;
    }
    @media print {
      aside, header, button { display: none !important; }
      main { margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
    }
  </style>
</head>
<body class="selection:bg-pink-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SEED DATA ---
    const INITIAL_CATEGORIES = [
      { id: 'cat-1', name: 'Food & Dining', icon: 'utensils', color: '#E76F51', isDefault: true },
      { id: 'cat-2', name: 'Transport', icon: 'car', color: '#F4A261', isDefault: true },
      { id: 'cat-3', name: 'Shopping', icon: 'shopping-bag', color: '#E9C46A', isDefault: true },
      { id: 'cat-4', name: 'Bills & Utilities', icon: 'home', color: '#8338EC', isDefault: true },
      { id: 'cat-5', name: 'Health', icon: 'heart', color: '#FF006E', isDefault: true },
      { id: 'cat-6', name: 'Others', icon: 'more-horizontal', color: '#94A3B8', isDefault: true },
    ];

    const INITIAL_TRANSACTIONS = [
      { id: 'tx-1', type: 'expense', amount: 2350, category: 'cat-1', categoryName: 'Food & Dining', note: 'Grocery', paymentMethod: 'UPI', dateTime: new Date(Date.now() - 3600000 * 2).toISOString() },
      { id: 'tx-2', type: 'expense', amount: 850, category: 'cat-1', categoryName: 'Food & Dining', note: 'Restaurant', paymentMethod: 'Credit Card', dateTime: new Date(Date.now() - 3600000 * 18).toISOString() },
      { id: 'tx-3', type: 'expense', amount: 120, category: 'cat-2', categoryName: 'Transport', note: 'Transport', paymentMethod: 'UPI', dateTime: new Date(Date.now() - 3600000 * 72).toISOString() },
      { id: 'tx-4', type: 'expense', amount: 2427, category: 'cat-1', categoryName: 'Food & Dining', note: 'Supermarket supplies', paymentMethod: 'Credit Card', dateTime: new Date(Date.now() - 86400000 * 6).toISOString() },
      { id: 'tx-5', type: 'expense', amount: 2859, category: 'cat-2', categoryName: 'Transport', note: 'Monthly Fuel & Metro Pass', paymentMethod: 'UPI', dateTime: new Date(Date.now() - 86400000 * 9).toISOString() },
      { id: 'tx-6', type: 'expense', amount: 2482, category: 'cat-3', categoryName: 'Shopping', note: 'Clothing & Books', paymentMethod: 'Credit Card', dateTime: new Date(Date.now() - 86400000 * 11).toISOString() },
      { id: 'tx-7', type: 'expense', amount: 1986, category: 'cat-4', categoryName: 'Bills & Utilities', note: 'Fiber Internet & Power', paymentMethod: 'Net Banking', dateTime: new Date(Date.now() - 86400000 * 13).toISOString() },
      { id: 'tx-8', type: 'expense', amount: 1655, category: 'cat-5', categoryName: 'Health', note: 'Pharmacy & Wellness', paymentMethod: 'UPI', dateTime: new Date(Date.now() - 86400000 * 16).toISOString() },
      { id: 'tx-9', type: 'expense', amount: 1821, category: 'cat-6', categoryName: 'Others', note: 'Stationery & Plant potting', paymentMethod: 'Cash', dateTime: new Date(Date.now() - 86400000 * 19).toISOString() },
      { id: 'tx-10', type: 'income', amount: 35000, category: 'cat-6', categoryName: 'Income', note: 'Monthly Salary', paymentMethod: 'Net Banking', dateTime: new Date(Date.now() - 86400000 * 5).toISOString() }
    ];

    const INITIAL_BUDGETS = [
      { id: 'b-1', categoryId: 'cat-1', categoryName: 'Food & Dining', limit: 6000 },
      { id: 'b-2', categoryId: 'cat-3', categoryName: 'Shopping', limit: 4000 },
      { id: 'b-3', categoryId: 'cat-4', categoryName: 'Bills & Utilities', limit: 2500 },
    ];

    const INITIAL_GOALS = [
      { id: 'g-1', name: 'Save for a Laptop', targetAmount: 60000, savedAmount: 18450, targetDate: '2026-12-31', status: 'active', icon: 'laptop' },
      { id: 'g-2', name: 'Emergency Fund', targetAmount: 100000, savedAmount: 45000, targetDate: '2027-03-31', status: 'active', icon: 'shield' },
    ];

    const INITIAL_NOTIFICATIONS = [
      { id: 'n-1', title: 'Budget Alert', message: 'Food & Dining is at 87% of its monthly limit (₹5,200 of ₹6,000).', type: 'budget_warning', isRead: false, createdAt: new Date().toISOString() },
      { id: 'n-2', title: 'Goal Progress', message: "You've saved ₹ 18,450 (30.7%) for your Laptop goal!", type: 'goal_milestone', isRead: false, createdAt: new Date(Date.now() - 3600000 * 4).toISOString() },
      { id: 'n-3', title: 'Upcoming Bill', message: 'Broadband renewal due in 3 days.', type: 'reminder', isRead: true, createdAt: new Date(Date.now() - 86400000).toISOString() },
    ];

    const MONTHLY_OVERVIEW_DATA = [
      { month: 'May', income: 30000, expense: 15000 },
      { month: 'Jun', income: 33000, expense: 22000 },
      { month: 'Jul', income: 31000, expense: 19000 },
      { month: 'Aug', income: 36000, expense: 21000 },
      { month: 'Sep', income: 34000, expense: 23000 },
      { month: 'Oct', income: 35000, expense: 16550 },
    ];

    // Formatters
    function formatINR(val, currency = '₹') {
      if (val === undefined || val === null || isNaN(val)) return `${currency} 0`;
      const num = Math.abs(Number(val));
      const formatted = num.toLocaleString('en-IN', { maximumFractionDigits: 0 });
      return `${val < 0 ? '- ' : ''}${currency} ${formatted}`;
    }

    function formatFriendlyDate(dtStr) {
      if (!dtStr) return '';
      const d = new Date(dtStr);
      const now = new Date();
      const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      if (d.toDateString() === now.toDateString()) return `Today, ${time}`;
      const yest = new Date(); yest.setDate(now.getDate() - 1);
      if (d.toDateString() === yest.toDateString()) return `Yesterday, ${time}`;
      return `${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, ${time}`;
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      // Storage states
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('spendaura_user')) || {
        name: 'Sushmitha',
        email: 'sushmitha@spendaura.com',
        currency: '₹',
        theme: 'blush-pink',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150',
      });

      const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('spendaura_categories')) || INITIAL_CATEGORIES);
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('spendaura_transactions')) || INITIAL_TRANSACTIONS);
      const [budgets, setBudgets] = useState(() => JSON.parse(localStorage.getItem('spendaura_budgets')) || INITIAL_BUDGETS);
      const [goals, setGoals] = useState(() => JSON.parse(localStorage.getItem('spendaura_goals')) || INITIAL_GOALS);
      const [notifications, setNotifications] = useState(() => JSON.parse(localStorage.getItem('spendaura_notifications')) || INITIAL_NOTIFICATIONS);

      // Persistence
      useEffect(() => { localStorage.setItem('spendaura_user', JSON.stringify(user)); }, [user]);
      useEffect(() => { localStorage.setItem('spendaura_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('spendaura_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('spendaura_budgets', JSON.stringify(budgets)); }, [budgets]);
      useEffect(() => { localStorage.setItem('spendaura_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('spendaura_notifications', JSON.stringify(notifications)); }, [notifications]);

      // Navigation & UI States
      const [currentPage, setCurrentPage] = useState('dashboard'); // 'dashboard', 'transactions', 'budgets', 'categories', 'reports', 'goals', 'profile'
      const [isAddExpenseOpen, setIsAddExpenseOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const [isNotifOpen, setIsNotifOpen] = useState(false);
      const [mobileSidebar, setMobileSidebar] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      // Metrics computation
      const totalIncome = useMemo(() => transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0), [transactions]);
      const totalExpense = useMemo(() => transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0), [transactions]);
      const savings = totalIncome - totalExpense;
      const totalBalance = savings;

      // Category stats
      const categoryStats = useMemo(() => {
        if (totalExpense === 0) return [];
        const map = {};
        categories.forEach(c => { map[c.id] = { ...c, total: 0 }; });
        transactions.forEach(t => {
          if (t.type === 'expense') {
            if (map[t.category]) map[t.category].total += Number(t.amount);
            else {
              const others = categories.find(c => c.name === 'Others') || categories[0];
              if (others && map[others.id]) map[others.id].total += Number(t.amount);
            }
          }
        });
        return Object.values(map)
          .filter(c => c.total > 0)
          .map(c => ({
            ...c,
            percentage: Math.round((c.total / totalExpense) * 100),
          }))
          .sort((a, b) => b.total - a.total);
      }, [categories, transactions, totalExpense]);

      // Dynamic budget computation
      const dynamicBudgets = useMemo(() => {
        return budgets.map(b => {
          const spent = transactions
            .filter(t => t.category === b.categoryId && t.type === 'expense')
            .reduce((s, t) => s + Number(t.amount), 0);
          return {
            ...b,
            spent,
            percentage: b.limit > 0 ? Math.round((spent / b.limit) * 100) : 0,
          };
        });
      }, [budgets, transactions]);

      // Handlers
      const handleSaveTransaction = (txData) => {
        const cat = categories.find(c => c.id === txData.category);
        if (editingTx) {
          setTransactions(prev => prev.map(t => t.id === editingTx.id ? { ...t, ...txData, categoryName: cat ? cat.name : t.categoryName } : t));
          triggerToast("Transaction updated successfully!");
        } else {
          const newTx = { ...txData, id: `tx-${Date.now()}`, categoryName: cat ? cat.name : 'Others' };
          setTransactions(prev => [newTx, ...prev]);
          triggerToast("Transaction recorded!");
        }
        setIsAddExpenseOpen(false);
        setEditingTx(null);
      };

      const handleDeleteTransaction = (id) => {
        setTransactions(prev => prev.filter(t => t.id !== id));
        triggerToast("Transaction removed.");
      };

      const handleAddCategory = (cat) => {
        const newCat = { ...cat, id: `cat-${Date.now()}`, isDefault: false };
        setCategories(prev => [...prev, newCat]);
        triggerToast(`Category "${newCat.name}" added.`);
      };

      const handleDeleteCategory = (catId) => {
        const others = categories.find(c => c.name === 'Others') || categories[0];
        setTransactions(prev => prev.map(t => t.category === catId ? { ...t, category: others.id, categoryName: others.name } : t));
        setCategories(prev => prev.filter(c => c.id !== catId));
        triggerToast("Category deleted; transactions moved to Others.");
      };

      const handleSaveBudget = (catId, limit) => {
        const cat = categories.find(c => c.id === catId);
        setBudgets(prev => {
          const idx = prev.findIndex(b => b.categoryId === catId);
          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = { ...copy[idx], limit: Number(limit) };
            return copy;
          }
          return [...prev, { id: `b-${Date.now()}`, categoryId: catId, categoryName: cat ? cat.name : 'Category', limit: Number(limit) }];
        });
        triggerToast("Budget updated.");
      };

      const handleGoalDeposit = (goalId, amt) => {
        setGoals(prev => prev.map(g => {
          if (g.id === goalId) {
            const newSaved = Number(g.savedAmount) + Number(amt);
            const isCompleted = newSaved >= g.targetAmount;
            if (isCompleted) {
              triggerToast(`🎉 Congratulations! You achieved your savings goal for ${g.name}!`);
            }
            return { ...g, savedAmount: newSaved, status: isCompleted ? 'completed' : 'active' };
          }
          return g;
        }));
      };

      return (
        <div className="min-h-screen bg-[#FCEDF0] flex">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 px-5 py-3 rounded-2xl bg-[#581C38] text-white text-xs font-bold shadow-2xl animate-bounce">
              {toastMessage}
            </div>
          )}

          {/* Mobile Sidebar Overlay */}
          {mobileSidebar && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-xs z-40 lg:hidden" onClick={() => setMobileSidebar(false)} />
          )}

          {/* LEFT SIDEBAR */}
          <aside className={`fixed top-0 bottom-0 left-0 z-50 w-72 bg-[#FCEDF0] flex flex-col justify-between border-r border-[#F5D5DE]/80 transition-transform duration-300 lg:translate-x-0 ${mobileSidebar ? 'translate-x-0 shadow-2xl' : '-translate-x-full'}`}>
            <div>
              {/* Logo */}
              <div className="flex items-center space-x-3 px-7 pt-7 pb-6">
                <div className="w-10 h-10 rounded-2xl bg-pink-100 flex items-center justify-center shadow-xs">
                  <svg viewBox="0 0 40 40" className="w-7 h-7">
                    <circle cx="20" cy="20" r="18" fill="#FCE7EE" />
                    <path d="M14 26C14 26 15 18 22 15C29 12 28 24 21 26C16 27.5 14 26 14 26Z" fill="#581C38" />
                    <path d="M26 14C26 14 22 19 16 19C12 19 13 13 18 12C22 11 26 14 26 14Z" fill="#F472B6" />
                  </svg>
                </div>
                <div>
                  <h1 className="font-serif text-2xl font-bold text-[#581C38] tracking-tight leading-none">SpendAura</h1>
                  <span className="text-xs text-[#8C4A67] font-medium tracking-wide">Expense Tracker</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="px-5 space-y-1.5 mt-2">
                {[
                  { id: 'dashboard', name: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                  { id: 'transactions', name: 'Transactions', icon: 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4' },
                  { id: 'budgets', name: 'Budgets', icon: 'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z' },
                  { id: 'categories', name: 'Categories', icon: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z' },
                  { id: 'reports', name: 'Reports', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
                  { id: 'goals', name: 'Goals', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
                ].map(item => {
                  const isActive = currentPage === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setCurrentPage(item.id); setMobileSidebar(false); }}
                      className={`w-full flex items-center space-x-3.5 px-4 py-3 rounded-2xl text-[15px] font-semibold transition-all ${isActive ? 'bg-[#FCE7EE] text-[#581C38] shadow-xs translate-x-1 font-bold' : 'text-[#6B5561] hover:text-[#581C38] hover:bg-[#FEEBF0]/70'}`}
                    >
                      <svg className={`w-5 h-5 ${isActive ? 'text-[#581C38]' : 'text-[#7D6672]'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={isActive ? 2.4 : 2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d={item.icon} />
                      </svg>
                      <span>{item.name}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Sidebar Bottom Ceramic Vase Illustration */}
            <div className="px-5 pb-3">
              <div className="relative w-full h-40 flex flex-col items-center justify-end overflow-hidden pointer-events-none">
                <div className="absolute bottom-0 inset-x-0 h-24 bg-gradient-to-t from-[#FADCE4]/60 to-transparent rounded-t-full"></div>
                {/* Plant branches & leaves */}
                <div className="relative z-10 w-24 h-24 -mb-3">
                  <svg viewBox="0 0 100 100" fill="none" className="w-full h-full drop-shadow-sm">
                    <path d="M50 100 C 50 60, 48 40, 50 10" stroke="#375540" strokeWidth="2.2" strokeLinecap="round" />
                    <path d="M50 70 C 35 55, 25 45, 18 35" stroke="#375540" strokeWidth="2" strokeLinecap="round" />
                    <path d="M50 60 C 65 48, 75 40, 82 28" stroke="#375540" strokeWidth="2" strokeLinecap="round" />
                    <ellipse cx="50" cy="15" rx="7" ry="12" fill="#4C785B" />
                    <ellipse cx="38" cy="35" rx="7" ry="11" transform="rotate(-30 38 35)" fill="#689E7B" />
                    <ellipse cx="62" cy="32" rx="7" ry="11" transform="rotate(30 62 32)" fill="#548663" />
                    <ellipse cx="22" cy="40" rx="6" ry="10" transform="rotate(-45 22 40)" fill="#7EAE8E" />
                    <ellipse cx="78" cy="34" rx="6" ry="10" transform="rotate(45 78 34)" fill="#639874" />
                    <circle cx="44" cy="48" r="3" fill="#E79A88" />
                    <circle cx="58" cy="44" r="2.5" fill="#E79A88" />
                  </svg>
                </div>
                {/* Ceramic Blush Vase */}
                <div className="relative z-10 w-14 h-14 bg-gradient-to-b from-[#F2BBC9] to-[#E396A9] rounded-2xl shadow-md border border-white/60 flex items-center justify-center">
                  <div className="absolute -top-1.5 w-7 h-2.5 bg-[#EAA5B6] rounded-t-lg"></div>
                  <div className="w-1.5 h-7 bg-white/40 rounded-full blur-[0.5px] ml-[-16px]"></div>
                </div>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT WRAPPER */}
          <div className="flex-1 flex flex-col min-w-0 lg:pl-72">
            {/* STICKY HEADER */}
            <header className="sticky top-0 z-30 flex items-center justify-between px-4 sm:px-8 py-4 bg-[#FCEDF0]/90 backdrop-blur-md">
              <div className="flex items-center space-x-3 lg:hidden">
                <button onClick={() => setMobileSidebar(true)} className="p-2 rounded-xl bg-white shadow-xs text-[#581C38]">
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
                <span className="font-serif font-bold text-lg text-[#581C38]">SpendAura</span>
              </div>

              {/* Search Bar matching template */}
              <div className="relative flex-1 max-w-md mx-2 sm:mx-0">
                <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8C6A78]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search transactions, categories..."
                  className="w-full pl-11 pr-4 py-2.5 bg-white text-sm text-[#3A0D22] placeholder-[#9D7D8B] rounded-full border border-pink-100/80 shadow-xs focus:outline-none focus:ring-2 focus:ring-[#581C38]/20"
                />
              </div>

              {/* Right Controls: Notifications & Profile */}
              <div className="flex items-center space-x-3 sm:space-x-4">
                <div className="hidden md:flex items-center space-x-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-white/70 border border-pink-100 text-[#7A5B69]">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                  <span>Interactive Live</span>
                </div>

                {/* Bell */}
                <button onClick={() => setIsNotifOpen(true)} className="relative p-2.5 rounded-full bg-white hover:bg-pink-50 text-[#581C38] shadow-xs border border-pink-100 transition-all hover:scale-105">

                        <div className="flex-1 min-w-0">
                          <span className="text-sm font-bold text-[#4A2D3C] block mb-2">{goals[0]?.name || 'Save for a Laptop'}</span>
                          <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden p-0.5 mb-2.5 max-w-[180px]">
                            <div className="h-full bg-[#14B8A6] rounded-full" style={{ width: `${Math.min(100, Math.round((goals[0]?.savedAmount / goals[0]?.targetAmount) * 100))}%` }} />
                          </div>
                          <div className="text-xs font-bold text-[#3A0D22]">
                            {formatINR(goals[0]?.savedAmount, user.currency)} <span className="text-gray-400 font-normal">/</span> {formatINR(goals[0]?.targetAmount, user.currency)}
                          </div>
                        </div>

                        {/* Laptop SVG Art */}
                        <div className="shrink-0 w-28 h-20">
                          <svg viewBox="0 0 140 100" fill="none" className="w-full h-full drop-shadow-md">
                            <rect x="25" y="15" width="90" height="58" rx="6" fill="#2E1825" stroke="#581C38" strokeWidth="2" />
                            <rect x="29" y="19" width="82" height="50" rx="3" fill="#F472B6" />
                            <path d="M10 76 L130 76 L120 86 C 119 88, 116 89, 114 89 L26 89 C 24 89, 21 88, 20 86 Z" fill="#E2E8F0" stroke="#CBD5E1" strokeWidth="1.5"/>
                            <rect x="58" y="79" width="24" height="6" rx="1.5" fill="#CBD5E1"/>
                          </svg>
                        </div>
                      </div>

                      <button
                        onClick={() => handleGoalDeposit(goals[0]?.id, 2000)}
                        className="mt-3 py-1.5 px-3 rounded-xl bg-pink-50 hover:bg-pink-100 text-[#581C38] text-xs font-bold transition-colors"
                      >
                        + Add ₹ 2,000 to Goal
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* TRANSACTIONS PAGE */}
              {currentPage === 'transactions' && (
                <div className="space-y-6 pb-12">
                  <div className="flex justify-between items-center">
                    <div>
                      <h1 className="font-serif text-3xl font-bold text-[#3A0D22]">Transactions</h1>
                      <p className="text-xs text-[#8C6A78]">All your income and expenses records.</p>
                    </div>
                    <button onClick={() => { setEditingTx(null); setIsAddExpenseOpen(true); }} className="px-5 py-2.5 rounded-full bg-[#581C38] text-white text-xs font-bold">
                      + Add Transaction
                    </button>
                  </div>

                  <div className="bg-white rounded-3xl shadow-xs border border-pink-100 overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-pink-50/70 border-b border-pink-100 text-[11px] font-bold text-[#8C6A78] uppercase">
                        <tr>
                          <th className="py-4 px-6">Note</th>
                          <th className="py-4 px-4">Category</th>
                          <th className="py-4 px-4">Date</th>
                          <th className="py-4 px-4">Method</th>
                          <th className="py-4 px-6 text-right">Amount</th>
                          <th className="py-4 px-6 text-center">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-pink-50">
                        {transactions.map(t => (
                          <tr key={t.id} className="hover:bg-pink-50/40">
                            <td className="py-3 px-6 font-bold text-[#3A0D22]">{t.note || t.categoryName}</td>
                            <td className="py-3 px-4"><span className="px-2 py-0.5 rounded-full bg-pink-50 font-semibold">{t.categoryName}</span></td>
                            <td className="py-3 px-4 text-[#8C6A78]">{formatFriendlyDate(t.dateTime)}</td>
                            <td className="py-3 px-4">{t.paymentMethod}</td>
                            <td className={`py-3 px-6 text-right font-bold text-sm ${t.type === 'expense' ? 'text-[#E11D48]' : 'text-[#0D9488]'}`}>
                              {t.type === 'expense' ? '- ' : '+ '}{formatINR(t.amount, user.currency).replace('- ', '')}
                            </td>
                            <td className="py-3 px-6 text-center space-x-2">
                              <button onClick={() => { setEditingTx(t); setIsAddExpenseOpen(true); }} className="text-[#581C38] font-bold hover:underline">Edit</button>
                              <button onClick={() => handleDeleteTransaction(t.id)} className="text-red-500 font-bold hover:underline">Delete</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* BUDGETS PAGE */}
              {currentPage === 'budgets' && (
                <div className="space-y-6 pb-12">
                  <h1 className="font-serif text-3xl font-bold text-[#3A0D22]">Monthly Budgets</h1>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {dynamicBudgets.map(b => (
                      <div key={b.categoryId} className="bg-white rounded-3xl p-6 shadow-xs border border-pink-100 space-y-3">
                        <h3 className="font-bold text-[#3A0D22] text-base">{b.categoryName}</h3>
                        <p className="text-xs text-[#8C6A78]">Spent: <strong>{formatINR(b.spent, user.currency)}</strong> of {formatINR(b.limit, user.currency)}</p>
                        <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                          <div className={`h-full rounded-full ${b.percentage >= 100 ? 'bg-red-600' : 'bg-[#581C38]'}`} style={{ width: `${Math.min(100, b.percentage)}%` }} />
                        </div>
                        <span className="text-xs font-bold text-[#581C38]">{b.percentage}% used</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* CATEGORIES PAGE */}
              {currentPage === 'categories' && (
                <div className="space-y-6 pb-12">
                  <h1 className="font-serif text-3xl font-bold text-[#3A0D22]">Categories</h1>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {categories.map(c => (
                      <div key={c.id} className="bg-white rounded-3xl p-5 shadow-xs border border-pink-100 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <span className="w-4 h-4 rounded-full" style={{ backgroundColor: c.color }} />
                          <span className="font-bold text-sm text-[#3A0D22]">{c.name}</span>
                        </div>
                        {!c.isDefault && (
                          <button onClick={() => handleDeleteCategory(c.id)} className="text-xs text-red-500 font-bold">Delete</button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* REPORTS PAGE */}
              {currentPage === 'reports' && (
                <div className="space-y-6 pb-12">
                  <div className="flex justify-between items-center">
                    <h1 className="font-serif text-3xl font-bold text-[#3A0D22]">Reports & Analytics</h1>
                    <button onClick={() => window.print()} className="px-4 py-2 bg-[#581C38] text-white text-xs font-bold rounded-full">Print Report</button>
                  </div>
                  <div className="bg-white rounded-3xl p-6 shadow-xs border border-pink-100 space-y-4">
                    <h3 className="font-bold text-base text-[#3A0D22]">Spending Breakdown</h3>
                    {categoryStats.map(c => (
                      <div key={c.name} className="space-y-1">
                        <div className="flex justify-between text-xs font-semibold">
                          <span>{c.name}</span>
                          <span>{formatINR(c.total, user.currency)} ({c.percentage}%)</span>
                        </div>
                        <div className="w-full h-2 bg-gray-100 rounded-full">
                          <div className="h-full rounded-full" style={{ width: `${c.percentage}%`, backgroundColor: c.color }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* GOALS PAGE */}
              {currentPage === 'goals' && (
                <div className="space-y-6 pb-12">
                  <h1 className="font-serif text-3xl font-bold text-[#3A0D22]">Savings Goals</h1>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {goals.map(g => (
                      <div key={g.id} className="bg-white rounded-3xl p-6 shadow-xs border border-pink-100 space-y-3">
                        <h3 className="font-bold text-lg text-[#3A0D22]">{g.name}</h3>
                        <p className="text-xs text-[#8C6A78]">Target: {formatINR(g.targetAmount, user.currency)}</p>
                        <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                          <div className="h-full bg-teal-500 rounded-full" style={{ width: `${Math.min(100, Math.round((g.savedAmount / g.targetAmount) * 100))}%` }} />
                        </div>
                        <div className="flex justify-between text-xs font-bold">
                          <span>Saved: {formatINR(g.savedAmount, user.currency)}</span>
                          <button onClick={() => handleGoalDeposit(g.id, 5000)} className="text-[#581C38] hover:underline">+ Add ₹ 5,000</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PROFILE PAGE */}
              {currentPage === 'profile' && (
                <div className="space-y-6 pb-12 max-w-xl mx-auto">
                  <h1 className="font-serif text-3xl font-bold text-[#3A0D22]">Profile & Settings</h1>
                  <div className="bg-white rounded-3xl p-6 shadow-xs border border-pink-100 space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-[#581C38] mb-1">User Name</label>
                      <input type="text" value={user.name} onChange={(e) => setUser({ ...user, name: e.target.value })} className="w-full p-2.5 bg-pink-50 rounded-xl text-xs font-bold" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#581C38] mb-1">Currency</label>
                      <select value={user.currency} onChange={(e) => setUser({ ...user, currency: e.target.value })} className="w-full p-2.5 bg-pink-50 rounded-xl text-xs font-bold">
                        <option value="₹">₹ INR (Indian Rupee)</option>
                        <option value="$">$ USD</option>
                        <option value="€">€ EUR</option>
                        <option value="£">£ GBP</option>
                      </select>
                    </div>
                    <button onClick={() => triggerToast("Profile updated!")} className="w-full py-2.5 bg-[#581C38] text-white rounded-xl text-xs font-bold">Save Settings</button>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* ADD / EDIT TRANSACTION MODAL */}
          {isAddExpenseOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-pink-100 space-y-4">
                <div className="flex justify-between items-center border-b border-pink-100 pb-3">
                  <h3 className="font-serif text-lg font-bold text-[#581C38]">{editingTx ? 'Edit Transaction' : 'Add Transaction'}</h3>
                  <button onClick={() => setIsAddExpenseOpen(false)} className="text-gray-400 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleSaveTransaction({
                    type: form.type.value,
                    amount: Number(form.amount.value),
                    category: form.category.value,
                    note: form.note.value,
                    paymentMethod: form.method.value,
                    dateTime: new Date().toISOString(),
                  });
                }} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-[#581C38] mb-1">Type</label>
                    <select name="type" defaultValue={editingTx?.type || 'expense'} className="w-full p-2 bg-pink-50 rounded-xl text-xs font-bold">
                      <option value="expense">Expense</option>
                      <option value="income">Income</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-[#581C38] mb-1">Amount ({user.currency})</label>
                    <input name="amount" type="number" required defaultValue={editingTx?.amount || ''} placeholder="0.00" className="w-full p-2 bg-pink-50 rounded-xl text-sm font-bold" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-[#581C38] mb-1">Category</label>
                    <select name="category" defaultValue={editingTx?.category || categories[0]?.id} className="w-full p-2 bg-pink-50 rounded-xl text-xs font-bold">
                      {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-[#581C38] mb-1">Note / Description</label>
                    <input name="note" type="text" defaultValue={editingTx?.note || ''} placeholder="e.g. Grocery, Lunch..." className="w-full p-2 bg-pink-50 rounded-xl text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-[#581C38] mb-1">Payment Method</label>
                    <select name="method" defaultValue={editingTx?.paymentMethod || 'UPI'} className="w-full p-2 bg-pink-50 rounded-xl text-xs font-bold">
                      <option>UPI</option>
                      <option>Credit Card</option>
                      <option>Debit Card</option>
                      <option>Cash</option>
                      <option>Net Banking</option>
                    </select>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsAddExpenseOpen(false)} className="px-4 py-2 text-xs font-bold text-gray-500">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold bg-[#581C38] text-white rounded-xl shadow-xs">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* NOTIFICATIONS DRAWER */}
          {isNotifOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/30 backdrop-blur-xs" onClick={() => setIsNotifOpen(false)}>
              <div className="w-full max-w-sm h-full bg-white shadow-2xl p-5 space-y-4" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-serif text-lg font-bold text-[#581C38]">Notifications</h3>
                  <button onClick={() => setIsNotifOpen(false)} className="text-gray-400">✕</button>
                </div>
                <div className="space-y-3 overflow-y-auto">
                  {notifications.map(n => (
                    <div key={n.id} className="p-3 bg-pink-50 rounded-2xl border border-pink-100 text-xs">
                      <span className="font-bold text-[#3A0D22] block">{n.title}</span>
                      <p className="text-[#581C38] mt-1">{n.message}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
